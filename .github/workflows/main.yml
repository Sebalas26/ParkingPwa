name: Compilar y Enviar Frontend React a Produccion (FTP)

on:
  push:
    branches:
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código fuente main y dev
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Compilar React en Producción
        run: npm run build

      - name: 5. Generar web.config para IIS (React SPA + PWA + Cache-Control)
        run: |
          cat << 'EOF' > dist/web.config
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="React SPA Routes" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                      <add input="{REQUEST_URI}" pattern="^/api" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="/" />
                  </rule>
                </rules>
                <outboundRules>
                  <rule name="No Cache SW" preCondition="IsServiceWorker">
                    <match serverVariable="RESPONSE_Cache-Control" pattern=".*" />
                    <action type="Rewrite" value="no-cache, no-store, must-revalidate, max-age=0" />
                  </rule>
                  <rule name="No Cache HTML" preCondition="IsHTML">
                    <match serverVariable="RESPONSE_Cache-Control" pattern=".*" />
                    <action type="Rewrite" value="no-cache, no-store, must-revalidate, max-age=0" />
                  </rule>
                  <rule name="No Cache Manifest" preCondition="IsManifest">
                    <match serverVariable="RESPONSE_Cache-Control" pattern=".*" />
                    <action type="Rewrite" value="no-cache, no-store, must-revalidate, max-age=0" />
                  </rule>
                  <rule name="Cache Hashed Assets" preCondition="IsHashedAsset">
                    <match serverVariable="RESPONSE_Cache-Control" pattern=".*" />
                    <action type="Rewrite" value="public, max-age=31536000, immutable" />
                  </rule>
                </outboundRules>
                <preConditions>
                  <preCondition name="IsServiceWorker">
                    <add input="{REQUEST_URI}" pattern="sw\.js$" />
                  </preCondition>
                  <preCondition name="IsHTML">
                    <add input="{RESPONSE_CONTENT_TYPE}" pattern="^text/html" />
                  </preCondition>
                  <preCondition name="IsManifest">
                    <add input="{REQUEST_URI}" pattern="\.webmanifest$" />
                  </preCondition>
                  <preCondition name="IsHashedAsset">
                    <add input="{REQUEST_URI}" pattern="^/assets/" />
                  </preCondition>
                </preConditions>
              </rewrite>
              <staticContent>
                <remove fileExtension=".webmanifest" />
                <mimeMap fileExtension=".webmanifest" mimeType="application/manifest+json" />
                <remove fileExtension=".json" />
                <mimeMap fileExtension=".json" mimeType="application/json" />
                <remove fileExtension=".woff" />
                <mimeMap fileExtension=".woff" mimeType="font/woff" />
                <remove fileExtension=".woff2" />
                <mimeMap fileExtension=".woff2" mimeType="font/woff2" />
              </staticContent>
              <httpProtocol>
                <customHeaders>
                  <add name="X-Content-Type-Options" value="nosniff" />
                </customHeaders>
              </httpProtocol>
            </system.webServer>
          </configuration>
          EOF

      - name: 6. Despliegue DIRECTO al servidor por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_FRONT }}
          username: ${{ secrets.FTP_USERNAME_FRONT }}
          password: ${{ secrets.FTP_PASSWORD_FRONT }}
          local-dir: ./dist/
          server-dir: /Parking/
          dangerous-clean-slate: true
