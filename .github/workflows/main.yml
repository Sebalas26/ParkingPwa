name: Compilar y Enviar Frontend React a Produccion (FTP)

on:
  push:
    branches:
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código fuente main y dev
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Compilar React en Producción
        run: npm run build

      - name: 5. Generar web.config para IIS (React SPA + PWA)
        run: |
          cat << 'EOF' > dist/web.config
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="React SPA Routes" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                      <add input="{REQUEST_URI}" pattern="^/api" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="/" />
                  </rule>
                </rules>
              </rewrite>
              <staticContent>
                <remove fileExtension=".webmanifest" />
                <mimeMap fileExtension=".webmanifest" mimeType="application/manifest+json" />
                <remove fileExtension=".json" />
                <mimeMap fileExtension=".json" mimeType="application/json" />
                <remove fileExtension=".woff" />
                <mimeMap fileExtension=".woff" mimeType="font/woff" />
                <remove fileExtension=".woff2" />
                <mimeMap fileExtension=".woff2" mimeType="font/woff2" />
              </staticContent>
              <httpProtocol>
                <customHeaders>
                  <add name="X-Content-Type-Options" value="nosniff" />
                </customHeaders>
              </httpProtocol>
            </system.webServer>

            <!-- Control Nativo Seguro IIS: sw.js sin cache -->
            <location path="sw.js">
              <system.webServer>
                <staticContent>
                  <clientCache cacheControlMode="DisableCache" />
                </staticContent>
                <httpProtocol>
                  <customHeaders>
                    <add name="Cache-Control" value="no-cache, no-store, must-revalidate, max-age=0" />
                    <add name="Pragma" value="no-cache" />
                    <add name="Expires" value="0" />
                  </customHeaders>
                </httpProtocol>
              </system.webServer>
            </location>

            <!-- Control Nativo Seguro IIS: index.html sin cache -->
            <location path="index.html">
              <system.webServer>
                <staticContent>
                  <clientCache cacheControlMode="DisableCache" />
                </staticContent>
                <httpProtocol>
                  <customHeaders>
                    <add name="Cache-Control" value="no-cache, no-store, must-revalidate, max-age=0" />
                    <add name="Pragma" value="no-cache" />
                    <add name="Expires" value="0" />
                  </customHeaders>
                </httpProtocol>
              </system.webServer>
            </location>
          </configuration>
          EOF

      - name: 6. Despliegue DIRECTO al servidor por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_FRONT }}
          username: ${{ secrets.FTP_USERNAME_FRONT }}
          password: ${{ secrets.FTP_PASSWORD_FRONT }}
          local-dir: ./dist/
          server-dir: /Parking/
          dangerous-clean-slate: true
