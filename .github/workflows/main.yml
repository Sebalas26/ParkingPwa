name: Compilar y Enviar Frontend React a Produccion (FTP)

on:
  push:
    branches:
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar el código fuente main y dev
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Compilar React en Producción
        run: npm run build

      - name: 5. Generar web.config para IIS (React SPA + PWA)
        run: |
          cat << 'EOF' > dist/web.config
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <!-- Enrutamiento SPA apuntando a la raíz del dominio -->
                  <rule name="React SPA Routes" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                      <add input="{REQUEST_URI}" pattern="^/api" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="/" />
                  </rule>
                </rules>
              </rewrite>
              
              <staticContent>
                <remove fileExtension=".webmanifest" />
                <mimeMap fileExtension=".webmanifest" mimeType="application/manifest+json" />
              </staticContent>

              <httpProtocol>
                <customHeaders>
                  <add name="X-Content-Type-Options" value="nosniff" />
                </customHeaders>
              </httpProtocol>
            </system.webServer>

            <!-- Bloqueo nativo IIS: Service Worker SIEMPRE fresco -->
            <location path="sw.js">
              <system.webServer>
                <staticContent>
                  <clientCache cacheControlMode="DisableCache" />
                </staticContent>
              </system.webServer>
            </location>

            <!-- Bloqueo nativo IIS: HTML principal SIEMPRE fresco -->
            <location path="index.html">
              <system.webServer>
                <staticContent>
                  <clientCache cacheControlMode="DisableCache" />
                </staticContent>
              </system.webServer>
            </location>

            <!-- Bloqueo nativo IIS: Manifest SIEMPRE fresco -->
            <location path="manifest.webmanifest">
              <system.webServer>
                <staticContent>
                  <clientCache cacheControlMode="DisableCache" />
                </staticContent>
              </system.webServer>
            </location>
          </configuration>
          EOF

      - name: 6. Despliegue DIRECTO al servidor por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_FRONT }}
          username: ${{ secrets.FTP_USERNAME_FRONT }}
          password: ${{ secrets.FTP_PASSWORD_FRONT }}
          local-dir: ./dist/
          server-dir: /Parking/
          dangerous-clean-slate: true
