<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5.3999999999999995" stdDeviation="7.2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="39.6" fill="url(#bgGrad)" />

  <!-- Inner Glowing Ring -->
  <circle cx="90" cy="90" r="68.4" fill="none" stroke="url(#accentGrad)" stroke-width="4.5" opacity="0.4" />

  <!-- Parking 'P' Symbol -->
  <g filter="url(#shadow)">
    <!-- Main P Letter -->
    <path d="M 61.2 46.800000000000004 
             L 93.60000000000001 46.800000000000004 
             C 122.4 46.800000000000004, 122.4 97.2, 93.60000000000001 97.2 
             L 79.2 97.2 
             L 79.2 133.2 
             L 61.2 133.2 Z" 
          fill="#ffffff" />
    
    <!-- P Inner Hole -->
    <path d="M 79.2 62.99999999999999 
             L 91.8 62.99999999999999 
             C 104.39999999999999 62.99999999999999, 104.39999999999999 81, 91.8 81 
             L 79.2 81 Z" 
          fill="#312e81" />

    <!-- Stylized Car Accent on lower right -->
    <path d="M 93.60000000000001 117 
             L 104.39999999999999 104.39999999999999 
             L 122.4 104.39999999999999 
             L 133.2 117 
             L 140.4 117 
             C 144 117, 144 129.6, 140.4 129.6 
             L 90 129.6 
             C 86.39999999999999 129.6, 86.39999999999999 117, 93.60000000000001 117 Z" 
          fill="url(#accentGrad)" />
    <!-- Car Wheels -->
    <circle cx="100.80000000000001" cy="129.6" r="5.3999999999999995" fill="#ffffff" />
    <circle cx="129.6" cy="129.6" r="5.3999999999999995" fill="#ffffff" />
  </g>
</svg>