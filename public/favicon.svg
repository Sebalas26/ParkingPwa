<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.92" stdDeviation="2.56" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14.08" fill="url(#bgGrad)" />

  <!-- Inner Glowing Ring -->
  <circle cx="32" cy="32" r="24.32" fill="none" stroke="url(#accentGrad)" stroke-width="1.6" opacity="0.4" />

  <!-- Parking 'P' Symbol -->
  <g filter="url(#shadow)">
    <!-- Main P Letter -->
    <path d="M 21.76 16.64 
             L 33.28 16.64 
             C 43.52 16.64, 43.52 34.56, 33.28 34.56 
             L 28.16 34.56 
             L 28.16 47.36 
             L 21.76 47.36 Z" 
          fill="#ffffff" />
    
    <!-- P Inner Hole -->
    <path d="M 28.16 22.4 
             L 32.64 22.4 
             C 37.12 22.4, 37.12 28.8, 32.64 28.8 
             L 28.16 28.8 Z" 
          fill="#312e81" />

    <!-- Stylized Car Accent on lower right -->
    <path d="M 33.28 41.6 
             L 37.12 37.12 
             L 43.52 37.12 
             L 47.36 41.6 
             L 49.92 41.6 
             C 51.2 41.6, 51.2 46.08, 49.92 46.08 
             L 32 46.08 
             C 30.72 46.08, 30.72 41.6, 33.28 41.6 Z" 
          fill="url(#accentGrad)" />
    <!-- Car Wheels -->
    <circle cx="35.84" cy="46.08" r="1.92" fill="#ffffff" />
    <circle cx="46.08" cy="46.08" r="1.92" fill="#ffffff" />
  </g>
</svg>